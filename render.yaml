services:
  - type: web
    name: shoppasto-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m app.render_runtime
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INVENTORY_GRPC_PORT
        value: "50051"
      - key: ORDERS_GRPC_PORT
        value: "50052"
      - key: LOG_LEVEL
        value: INFO
